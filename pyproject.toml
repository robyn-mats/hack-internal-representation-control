[project]
name = "internal-representation-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.22.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sae-lens>=6.45.3",
    "scipy>=1.18.0",
    "torch>=2.12.1",
    "transformers>=5.13.0",
    "tyro>=1.0.15",
]

[dependency-groups]
# Jupyter kernel for rk_scripts/gemma_session.ipynb (load Gemma once, iterate).
#   uv run --group dev jupyter lab --no-browser --ip=0.0.0.0 --port=8888
dev = [
    "ipykernel>=6.30.0",
    "ipywidgets>=8.1.0",
    "jupyterlab>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["irc"]
